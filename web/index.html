<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主播拌面店</title><link rel="stylesheet" href="style.css"><body><main><header><div><small>LIVE KITCHEN · BILIBILI</small><h1>主播拌面店 <span>原型试营业</span></h1></div><div class="actions"><button id="simulate">＋ 模拟礼物点餐</button><button id="settings">直播接入</button></div></header><section class="toolbar"><span id="status">● 离线试玩</span><span id="counts"></span><button id="deliver">试验出餐</button><button id="clear">清理操作台</button></section><canvas id="game" width="1200" height="740" aria-label="按住鼠标左键拖出碗、面条和臊子，在工作台制作拌面"></canvas><footer><b>按住 → 拖动 → 松开</b><span>先取碗，再加面与臊子；食材可暂放台面，完整的碗仍可继续加料。</span><span id="hint">今天也要认真做一碗面。</span></footer><section class="feed"><h3>直播互动</h3><div id="log">模拟礼物与真实礼物使用同一个订单入口。</div></section></main><dialog id="panel"><h2>B 站直播接入</h2><p>先运行本地桥接服务；房间号与 SESSDATA 在启动服务时配置。</p><label>桥接 WebSocket 地址<input id="ws" value="ws://127.0.0.1:8765/events"></label><label>触发点餐的礼物名称（逗号分隔）<input id="gifts" value="小心心"></label><label>或礼物 ID（逗号分隔，优先于名称）<input id="giftids" placeholder="留空则使用名称"></label><label>连送处理<select id="quantity"><option value="event">每条礼物事件一位顾客</option><option value="unit">每个礼物一位顾客</option></select></label><p>头像来自礼物 / 弹幕事件；图片失败时显示占位角色。弹幕只展示，不点餐。</p><button id="connect">连接桥接</button><button id="disconnect">断开</button><button id="close">关闭</button></dialog><script src="config.js"></script><script src="systems.js"></script><script src="renderer.js"></script><script src="game.js"></script></body></html>
